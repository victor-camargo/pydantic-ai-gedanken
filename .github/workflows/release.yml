name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    # Runs on tag pushes and on PRs from develop to main
    if: github.event_name == 'push' || github.head_ref == 'develop'
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(grep -oP "(?<=__version__ = ')[^']+" pydantic_ai_gedanken/__init__.py)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match __version__ = '$PKG_VERSION'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build]
    # Only publish on version tag pushes, never on PRs
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/pydantic-ai-gedanken/
    permissions:
      # Required for PyPI trusted publishing (OIDC)
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
